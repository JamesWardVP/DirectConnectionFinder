# Builds the site with a fresh timetable and publishes it to GitHub Pages.
#
# Runs every night (after Network Rail publishes the day's timetable), again
# in the afternoon as a backstop (GitHub can delay or drop scheduled runs), on
# every push to main, and on demand from the Actions tab.
#
# Runs on other branches only build and check the timetable: deploying and
# testing the live site are skipped, as only main publishes the site.
#
# Timetable source (set in Settings > Secrets and variables > Actions):
#   secrets NROD_USERNAME + NROD_PASSWORD  Network Rail open data account
#   variable TIMETABLE_GTFS_URL            or a URL of a GTFS zip
#   variable TIMETABLE_DAYS                days ahead to include (default 28)
# With neither set, the demo timetable is published.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
    - cron: '47 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Download timetable
        id: timetable
        env:
          NROD_USERNAME: ${{ secrets.NROD_USERNAME }}
          NROD_PASSWORD: ${{ secrets.NROD_PASSWORD }}
          TIMETABLE_GTFS_URL: ${{ vars.TIMETABLE_GTFS_URL }}
        run: bash scripts/fetch-timetable.sh

      - name: Build site
        env:
          DCF_SOURCE: ${{ steps.timetable.outputs.source }}
          DCF_INPUT: ${{ steps.timetable.outputs.input }}
          DCF_DAYS: ${{ vars.TIMETABLE_DAYS || '28' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Check timetable with real searches
        run: node scripts/check-site.js dist

      - name: Show raw timetable records for trains that failed the check
        if: failure() && steps.timetable.outputs.source == 'cif'
        run: |
          for uid in $(cat broken-uids.txt 2>/dev/null | sort -u); do
            echo "=== $uid"
            zcat timetable/toc-full.CIF.gz | grep -A40 "^BS.$uid" | awk 'NR>1 && /^BS/ {exit} {print}' | head -60
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Opens the live website in a real browser and uses it like a visitor.
  # Runs even if this run's deploy did not happen, to test what is live.
  test-live:
    needs: deploy
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Test the live site
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: node scripts/test-live.mjs "$SITE_URL"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-screenshots
          path: screenshots/
